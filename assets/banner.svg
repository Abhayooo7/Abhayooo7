<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <!-- Background gradient: deep black to rich blue -->
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/> <!-- GitHub black -->
      <stop offset="100%" stop-color="#0a3d62"/> <!-- Deep blue -->
    </linearGradient>

    <!-- Neon glow filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.4"/>

  <!-- Accent retro lines -->
  <g stroke="#00d4ff" stroke-width="2" opacity="0.8">
    <line x1="0" y1="60" x2="500" y2="60"/>
    <line x1="1100" y1="360" x2="1600" y2="360"/>
  </g>

  <!-- Main Title -->
  <g filter="url(#neonGlow)">
    <text x="800" y="170" text-anchor="middle" font-size="56" fill="#00d4ff" font-family="'Orbitron', sans-serif">
      Abhay Mahajan
    </text>
    <text x="800" y="230" text-anchor="middle" font-size="26" fill="#58a6ff" font-family="'Share Tech Mono', monospace">
      AI/ML • Web-Dev
    </text>
  </g>

  <!-- Tagline box -->
  <rect x="550" y="300" rx="8" ry="8" width="500" height="42" fill="rgba(10,17,23,0.85)" stroke="#00d4ff" stroke-width="1.5" opacity="0.95"/>
  <text x="800" y="328" text-anchor="middle" font-size="18" fill="#58a6ff" font-family="'Share Tech Mono', monospace">
    Building useful things, one repo at a time
  </text>
</svg>
