<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <g opacity="0.2">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.15"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>
  <g stroke="#00ff88" stroke-width="2" opacity="0.7">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="1200" y1="350" x2="1600" y2="350"/>
  </g>
  <g filter="url(#glow)">
    <text x="800" y="170" text-anchor="middle" font-size="54" fill="#e5ffe5" font-family="Segoe UI, Roboto, Arial, sans-serif">
      Abhay Mahajan
    </text>
    <text x="800" y="230" text-anchor="middle" font-size="28" fill="#00ff88" font-family="Segoe UI, Roboto, Arial, sans-serif">
      AI/ML • Web-Dev
    </text>
  </g>
  <rect x="640" y="300" rx="8" ry="8" width="320" height="40" fill="#0d1f16" stroke="#00ff88" opacity="0.9"/>
  <text x="800" y="328" text-anchor="middle" font-size="18" fill="#aaffcc" font-family="Segoe UI, Roboto, Arial, sans-serif">
    Building useful things, one repo at a time
  </text>
</svg>
